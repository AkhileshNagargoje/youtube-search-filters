name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: validate & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Static checks: manifest references, i18n keys, version drift, permissions.
      - name: Validate extension package
        run: npm run validate

      # Behavioural checks against a mock YouTube DOM.
      - name: Run tests
        run: npm test

      # Proves the store builds still assemble, and attaches them to the run so
      # they can be installed without cloning.
      - name: Build store packages
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: dist/*.zip
          if-no-files-found: error
