name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: validate & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Static checks: manifest references, i18n keys, version drift, permissions.
      - name: Validate extension package
        run: npm run validate

      # Behavioural checks against a mock YouTube DOM.
      - name: Run tests
        run: npm test
